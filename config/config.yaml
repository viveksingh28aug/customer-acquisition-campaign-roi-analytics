app:
  name: "Customer Acquisition & Campaign ROI Analytics"
  version: "1.0.0"
  description: "Enterprise portfolio project analyzing marketing attribution, acquisition unit economics, and campaign ROI."

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  sql_dir: "sql"
  log_dir: "logs"
  log_file: "logs/app.log"

database:
  fallback_sqlite_path: "data/marketing_analytics.duckdb"
  batch_size: 500

analytics:
  default_attribution_model: "last_touch"
  confidence_level: 0.95
  alpha: 0.05
  kpi_targets:
    target_ltv_cac_ratio: 3.0
    target_roas_multiple: 3.5
    target_cvr_pct: 3.5
    target_payback_months: 6.0

# Documented baseline assumptions for cost simulation (Requirement 5)
assumptions:
  disclaimer: >
    Simulated benchmark parameters are derived from industry standards (B2B SaaS and Consumer E-Commerce marketing benchmarks).
    All cost metrics in this portfolio demo represent benchmark assumptions clearly separated from primary observations.
  cogs_percentage: 0.35  # Cost of Goods Sold is assumed 35% of Gross Merchandise Value
  blended_organic_operating_cost_per_day: 50.0  # Content/SEO creation cost allocated per day for organic channels
